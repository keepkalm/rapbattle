name = "rapbattle"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# D1 database
[[d1_databases]]
binding = "DB"
database_name = "rapbattle"
database_id = "143b9f0d-c431-4495-aa86-632b2e1fbacb"

# R2 bucket for verse audio
[[r2_buckets]]
binding = "AUDIO"
bucket_name = "rapbattle-audio"

# Workers AI for TTS
[ai]
binding = "AI"

# OAuth token/client storage (create with: npx wrangler kv namespace create OAUTH_KV)
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "655e9d971f65449f83086a949ab36fe2"

# BattleDO removed: it was written to at three call sites and read by nothing,
# and it kept a second copy of battle state whose finish logic disagreed with
# D1's. D1 is the single source of truth. Dropping the binding alone fails the
# deploy — the class has to be deleted by migration.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["BattleDO"]

[[migrations]]
tag = "v2"
deleted_classes = ["BattleDO"]
