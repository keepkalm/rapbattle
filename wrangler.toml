name = "rapbattle"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# D1 database
[[d1_databases]]
binding = "DB"
database_name = "rapbattle"
database_id = "143b9f0d-c431-4495-aa86-632b2e1fbacb"

# R2 bucket for verse audio
[[r2_buckets]]
binding = "AUDIO"
bucket_name = "rapbattle-audio"

# Workers AI for TTS
[ai]
binding = "AI"

# OAuth token/client storage (create with: npx wrangler kv namespace create OAUTH_KV)
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "655e9d971f65449f83086a949ab36fe2"

# Durable Object for live battles
[[durable_objects.bindings]]
name = "BATTLE"
class_name = "BattleDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BattleDO"]
