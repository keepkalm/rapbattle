name: typecheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # npm ci, not npm install: it installs exactly the committed lockfile and
      # fails loudly if package.json and package-lock.json ever drift apart —
      # which is the breakage this workflow exists to catch.
      - run: npm ci
      - run: npm run typecheck
